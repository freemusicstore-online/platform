<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Beat Maker - FreeMusicStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #8b5cf6;
  --accent-hover: #7c3aed;
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface-2: #252525;
  --border: #333;
  --text: #f5f5f5;
  --text-dim: #999;
  --active-step: #8b5cf620;
  --kick: #ef4444;
  --snare: #f59e0b;
  --hihat: #22d3ee;
  --clap: #a78bfa;
}
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.topbar .back { font-size: 14px; font-weight: 500; }
.topbar h1 { font-size: 18px; font-weight: 700; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }

.controls {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 24px;
}
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: var(--accent-hover); }
.btn.secondary {
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.btn.secondary:hover { background: var(--border); }
.btn.active { background: var(--accent-hover); box-shadow: 0 0 0 2px var(--accent); }

.tempo-group {
  display: flex; align-items: center; gap: 8px;
}
.tempo-group label { font-size: 13px; color: var(--text-dim); font-weight: 500; }
.tempo-group input[type="range"] {
  width: 120px; accent-color: var(--accent);
}
.tempo-group .tempo-val {
  font-size: 14px; font-weight: 700; min-width: 60px;
}

.grid-wrapper { overflow-x: auto; }

.grid {
  display: grid;
  grid-template-columns: 60px repeat(16, 1fr);
  gap: 4px;
  min-width: 700px;
}
.grid .row-label {
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 8px;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  color: var(--text-dim);
  height: 48px;
}
.grid .step {
  width: 100%; height: 48px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
  position: relative;
}
.grid .step:hover { border-color: #555; }
.grid .step.on { border-color: transparent; }
.grid .step.on[data-row="0"] { background: var(--kick); }
.grid .step.on[data-row="1"] { background: var(--snare); }
.grid .step.on[data-row="2"] { background: var(--hihat); }
.grid .step.on[data-row="3"] { background: var(--clap); }
.grid .step.current {
  box-shadow: inset 0 0 0 2px var(--accent);
}

.step-numbers {
  display: grid;
  grid-template-columns: 60px repeat(16, 1fr);
  gap: 4px;
  margin-bottom: 4px;
  min-width: 700px;
}
.step-numbers span {
  text-align: center; font-size: 11px; color: var(--text-dim); font-weight: 500;
}
.step-numbers span:first-child { visibility: hidden; }

.status { margin-top: 16px; font-size: 13px; color: var(--text-dim); min-height: 20px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="back">&larr; Back to Store</a>
  <h1>Beat Maker</h1>
</div>
<div class="container">
  <div class="controls">
    <button class="btn" id="playBtn">Play</button>
    <button class="btn secondary" id="clearBtn">Clear</button>
    <div class="tempo-group">
      <label>Tempo</label>
      <input type="range" id="tempoSlider" min="60" max="200" value="120">
      <span class="tempo-val" id="tempoVal">120 BPM</span>
    </div>
    <button class="btn secondary" id="exportBtn">Export WAV</button>
  </div>

  <div class="grid-wrapper">
    <div class="step-numbers" id="stepNumbers"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const ROWS = ['Kick', 'Snare', 'HiHat', 'Clap'];
const STEPS = 16;
const STORAGE_KEY = 'fmus-beat-maker-pattern';

let audioCtx = null;
let pattern = loadPattern();
let playing = false;
let currentStep = -1;
let timerId = null;
let nextStepTime = 0;
const scheduleAhead = 0.05;
const lookahead = 25;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function loadPattern() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const p = JSON.parse(saved);
      if (p.length === 4 && p[0].length === 16) return p;
    }
  } catch {}
  return Array.from({ length: 4 }, () => Array(16).fill(false));
}

function savePattern() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(pattern));
}

function buildGrid() {
  const numRow = document.getElementById('stepNumbers');
  numRow.innerHTML = '<span></span>' + Array.from({ length: 16 }, (_, i) => `<span>${i + 1}</span>`).join('');

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < 4; r++) {
    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = ROWS[r];
    grid.appendChild(label);
    for (let s = 0; s < 16; s++) {
      const cell = document.createElement('div');
      cell.className = 'step' + (pattern[r][s] ? ' on' : '');
      cell.dataset.row = r;
      cell.dataset.step = s;
      cell.addEventListener('click', () => {
        pattern[r][s] = !pattern[r][s];
        cell.classList.toggle('on');
        savePattern();
      });
      grid.appendChild(cell);
    }
  }
}

function playKick(ctx, time) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);
  gain.gain.setValueAtTime(1, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.3);
}

function playSnare(ctx, time) {
  // noise burst
  const bufSize = ctx.sampleRate * 0.15;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.6, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  const filt = ctx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = 1000;
  noise.connect(filt).connect(noiseGain).connect(ctx.destination);
  noise.start(time);
  noise.stop(time + 0.15);

  // body
  const osc = ctx.createOscillator();
  const oscGain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, time);
  osc.frequency.exponentialRampToValueAtTime(100, time + 0.05);
  oscGain.gain.setValueAtTime(0.7, time);
  oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
  osc.connect(oscGain).connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.1);
}

function playHiHat(ctx, time) {
  const bufSize = ctx.sampleRate * 0.05;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 7000;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 10000;
  noise.connect(hp).connect(bp).connect(gain).connect(ctx.destination);
  noise.start(time);
  noise.stop(time + 0.05);
}

function playClap(ctx, time) {
  const bufSize = ctx.sampleRate * 0.15;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    const env = i < bufSize * 0.02 ? 1 :
                i < bufSize * 0.04 ? 0.3 :
                i < bufSize * 0.06 ? 0.8 :
                Math.exp(-((i - bufSize * 0.06) / (bufSize * 0.3)) * 5);
    data[i] = (Math.random() * 2 - 1) * env;
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.5, time);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2500;
  bp.Q.value = 1.5;
  noise.connect(bp).connect(gain).connect(ctx.destination);
  noise.start(time);
  noise.stop(time + 0.15);
}

const soundFns = [playKick, playSnare, playHiHat, playClap];

function getTempo() { return parseInt(document.getElementById('tempoSlider').value); }

function scheduler() {
  const ctx = getAudioCtx();
  while (nextStepTime < ctx.currentTime + scheduleAhead) {
    const step = (currentStep + 1) % STEPS;
    currentStep = step;
    for (let r = 0; r < 4; r++) {
      if (pattern[r][step]) {
        soundFns[r](ctx, nextStepTime);
      }
    }
    const secPerBeat = 60.0 / getTempo();
    const secPerStep = secPerBeat / 4;
    nextStepTime += secPerStep;

    // Visual update
    const allSteps = document.querySelectorAll('.step');
    allSteps.forEach(s => s.classList.remove('current'));
    for (let r = 0; r < 4; r++) {
      const idx = r * STEPS + step;
      // offset by row labels: each row has 1 label + 16 steps
      const grid = document.getElementById('grid');
      const children = grid.children;
      const cellIdx = r * (STEPS + 1) + 1 + step;
      if (children[cellIdx]) children[cellIdx].classList.add('current');
    }
  }
}

function startPlayback() {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  playing = true;
  currentStep = -1;
  nextStepTime = ctx.currentTime;
  timerId = setInterval(scheduler, lookahead);
  document.getElementById('playBtn').textContent = 'Stop';
  document.getElementById('playBtn').classList.add('active');
}

function stopPlayback() {
  playing = false;
  clearInterval(timerId);
  currentStep = -1;
  document.querySelectorAll('.step').forEach(s => s.classList.remove('current'));
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('playBtn').classList.remove('active');
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) stopPlayback(); else startPlayback();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  pattern = Array.from({ length: 4 }, () => Array(16).fill(false));
  savePattern();
  buildGrid();
  document.getElementById('status').textContent = 'Pattern cleared.';
});

document.getElementById('tempoSlider').addEventListener('input', (e) => {
  document.getElementById('tempoVal').textContent = e.target.value + ' BPM';
});

// Export WAV
document.getElementById('exportBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  status.textContent = 'Rendering WAV...';

  const tempo = getTempo();
  const secPerStep = (60.0 / tempo) / 4;
  const totalDuration = STEPS * secPerStep + 0.5;
  const offCtx = new OfflineAudioContext(2, Math.ceil(44100 * totalDuration), 44100);

  for (let s = 0; s < STEPS; s++) {
    const t = s * secPerStep;
    for (let r = 0; r < 4; r++) {
      if (pattern[r][s]) {
        soundFns[r](offCtx, t);
      }
    }
  }

  const rendered = await offCtx.startRendering();
  const wav = audioBufferToWav(rendered);
  const blob = new Blob([wav], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'beat-maker-export.wav';
  a.click();
  URL.revokeObjectURL(url);
  status.textContent = 'WAV exported!';
});

function audioBufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const sr = buffer.sampleRate;
  const len = buffer.length;
  const interleaved = new Float32Array(len * numCh);
  for (let ch = 0; ch < numCh; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < len; i++) interleaved[i * numCh + ch] = data[i];
  }
  const dataLen = interleaved.length * 2;
  const arrBuf = new ArrayBuffer(44 + dataLen);
  const view = new DataView(arrBuf);
  function writeStr(o, s) { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataLen, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true);
  view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, dataLen, true);
  let offset = 44;
  for (let i = 0; i < interleaved.length; i++) {
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    offset += 2;
  }
  return arrBuf;
}

buildGrid();
</script>
<script src="/related.js"></script>
</body>
</html>
