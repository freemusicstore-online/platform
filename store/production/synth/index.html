<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Web Synth - FreeMusicStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #8b5cf6;
  --accent-hover: #7c3aed;
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface-2: #252525;
  --border: #333;
  --text: #f5f5f5;
  --text-dim: #999;
}
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.topbar .back { font-size: 14px; font-weight: 500; }
.topbar h1 { font-size: 18px; font-weight: 700; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }

.section-title {
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 12px; letter-spacing: 0.5px;
}

/* Waveform display */
.waveform-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 24px;
}
#waveformCanvas {
  width: 100%; height: 120px;
  border-radius: 8px;
  background: var(--surface-2);
}

/* Controls */
.controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}
@media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }

.control-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.control-panel h3 {
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 12px;
}

.osc-types {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.osc-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.osc-btn:hover { border-color: #555; }
.osc-btn.active { background: var(--accent); border-color: var(--accent); }

.slider-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.slider-row:last-child { margin-bottom: 0; }
.slider-row label {
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  min-width: 36px;
}
.slider-row input[type="range"] {
  flex: 1; accent-color: var(--accent);
}
.slider-row .val {
  font-size: 12px; font-weight: 700; min-width: 44px; text-align: right;
}

/* Keyboard */
.keyboard-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  overflow-x: auto;
}
.keyboard {
  display: flex;
  position: relative;
  height: 160px;
  min-width: 600px;
  user-select: none;
}
.key {
  position: relative;
  cursor: pointer;
  transition: background 0.05s;
}
.key.white {
  width: 40px; height: 160px;
  background: #f0f0f0;
  border: 1px solid #ccc;
  border-radius: 0 0 6px 6px;
  z-index: 1;
}
.key.white:hover { background: #e0e0e0; }
.key.white.active { background: var(--accent); }

.key.black {
  width: 26px; height: 100px;
  background: #222;
  border: 1px solid #111;
  border-radius: 0 0 4px 4px;
  margin-left: -13px;
  margin-right: -13px;
  z-index: 2;
}
.key.black:hover { background: #444; }
.key.black.active { background: var(--accent); }

.key .label {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 700;
  color: var(--text-dim);
  pointer-events: none;
}
.key.black .label { color: #888; }
.key.active .label { color: #fff; }

.hint {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-dim);
}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="back">&larr; Back to Store</a>
  <h1>Web Synth</h1>
</div>
<div class="container">

  <div class="waveform-container">
    <canvas id="waveformCanvas"></canvas>
  </div>

  <div class="controls-grid">
    <div class="control-panel">
      <h3>Oscillator</h3>
      <div class="osc-types" id="oscTypes">
        <button class="osc-btn active" data-type="sine">Sine</button>
        <button class="osc-btn" data-type="square">Square</button>
        <button class="osc-btn" data-type="sawtooth">Saw</button>
        <button class="osc-btn" data-type="triangle">Triangle</button>
      </div>
    </div>
    <div class="control-panel">
      <h3>Filter (Lowpass)</h3>
      <div class="slider-row">
        <label>Cut</label>
        <input type="range" id="filterCutoff" min="50" max="15000" value="8000">
        <span class="val" id="cutoffVal">8000</span>
      </div>
      <div class="slider-row">
        <label>Res</label>
        <input type="range" id="filterRes" min="0" max="30" value="1" step="0.5">
        <span class="val" id="resVal">1.0</span>
      </div>
    </div>
    <div class="control-panel" style="grid-column: 1 / -1;">
      <h3>Envelope (ADSR)</h3>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        <div class="slider-row" style="flex-direction:column;align-items:stretch;">
          <label style="text-align:center;margin-bottom:4px;">Attack</label>
          <input type="range" id="envA" min="0.005" max="2" value="0.01" step="0.005">
          <span class="val" style="text-align:center;" id="envAVal">0.01s</span>
        </div>
        <div class="slider-row" style="flex-direction:column;align-items:stretch;">
          <label style="text-align:center;margin-bottom:4px;">Decay</label>
          <input type="range" id="envD" min="0.01" max="2" value="0.1" step="0.01">
          <span class="val" style="text-align:center;" id="envDVal">0.10s</span>
        </div>
        <div class="slider-row" style="flex-direction:column;align-items:stretch;">
          <label style="text-align:center;margin-bottom:4px;">Sustain</label>
          <input type="range" id="envS" min="0" max="1" value="0.7" step="0.01">
          <span class="val" style="text-align:center;" id="envSVal">0.70</span>
        </div>
        <div class="slider-row" style="flex-direction:column;align-items:stretch;">
          <label style="text-align:center;margin-bottom:4px;">Release</label>
          <input type="range" id="envR" min="0.01" max="3" value="0.3" step="0.01">
          <span class="val" style="text-align:center;" id="envRVal">0.30s</span>
        </div>
      </div>
    </div>
  </div>

  <div class="keyboard-container">
    <div class="keyboard" id="keyboard"></div>
    <div class="hint">Keyboard: A-K = white keys, W E T Y U O P = black keys</div>
  </div>

</div>

<script>
const STORAGE_PREFIX = 'fmus-synth-';
let audioCtx = null;
let analyser = null;
let filter = null;
let activeVoices = {};
let oscType = localStorage.getItem(STORAGE_PREFIX + 'oscType') || 'sine';

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = parseFloat(document.getElementById('filterCutoff').value);
    filter.Q.value = parseFloat(document.getElementById('filterRes').value);
    filter.connect(analyser).connect(audioCtx.destination);
  }
  return audioCtx;
}

// Notes for 2 octaves starting at C4
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const OCTAVES = [4, 5];
const notes = [];
for (const oct of OCTAVES) {
  for (const n of NOTE_NAMES) {
    notes.push({ name: n + oct, freq: 440 * Math.pow(2, (NOTE_NAMES.indexOf(n) + (oct - 4) * 12 - 9) / 12), black: n.includes('#') });
  }
}

// Key mappings: white keys = ASDFGHJKL;' (bottom row), black keys positioned
const whiteNotes = notes.filter(n => !n.black);
const blackNotes = notes.filter(n => n.black);

// Computer keyboard mapping
const WHITE_KEYS = ['a','s','d','f','g','h','j','k','l',';',"'",'z','x','c','v'];
const BLACK_KEYS_MAP = { 'w': 0, 'e': 1, 't': 2, 'y': 3, 'u': 4, 'o': 5, 'p': 6, '[': 7, '=': 8, 'q': 9 };

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  let whiteIdx = 0;
  for (let i = 0; i < notes.length; i++) {
    const note = notes[i];
    const key = document.createElement('div');
    key.className = 'key ' + (note.black ? 'black' : 'white');
    key.dataset.noteIdx = i;

    const label = document.createElement('span');
    label.className = 'label';
    if (!note.black && whiteIdx < WHITE_KEYS.length) {
      label.textContent = WHITE_KEYS[whiteIdx].toUpperCase();
    }
    key.appendChild(label);

    key.addEventListener('mousedown', (e) => { e.preventDefault(); noteOn(i); });
    key.addEventListener('mouseup', () => noteOff(i));
    key.addEventListener('mouseleave', () => noteOff(i));
    key.addEventListener('touchstart', (e) => { e.preventDefault(); noteOn(i); }, { passive: false });
    key.addEventListener('touchend', (e) => { e.preventDefault(); noteOff(i); });

    kb.appendChild(key);
    if (!note.black) whiteIdx++;
  }
}

function getEnvelope() {
  return {
    a: parseFloat(document.getElementById('envA').value),
    d: parseFloat(document.getElementById('envD').value),
    s: parseFloat(document.getElementById('envS').value),
    r: parseFloat(document.getElementById('envR').value),
  };
}

function noteOn(idx) {
  if (activeVoices[idx]) return;
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const note = notes[idx];
  const env = getEnvelope();

  const osc = ctx.createOscillator();
  osc.type = oscType;
  osc.frequency.value = note.freq;

  const gain = ctx.createGain();
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.3, now + env.a);
  gain.gain.linearRampToValueAtTime(0.3 * env.s, now + env.a + env.d);

  osc.connect(gain).connect(filter);
  osc.start(now);

  activeVoices[idx] = { osc, gain };

  const key = document.querySelector(`.key[data-note-idx="${idx}"]`);
  if (key) key.classList.add('active');
}

function noteOff(idx) {
  const voice = activeVoices[idx];
  if (!voice) return;
  const ctx = getCtx();
  const env = getEnvelope();
  const now = ctx.currentTime;
  voice.gain.gain.cancelScheduledValues(now);
  voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
  voice.gain.gain.linearRampToValueAtTime(0, now + env.r);
  voice.osc.stop(now + env.r + 0.05);
  delete activeVoices[idx];

  const key = document.querySelector(`.key[data-note-idx="${idx}"]`);
  if (key) key.classList.remove('active');
}

// Oscillator type selection
document.querySelectorAll('.osc-btn').forEach(btn => {
  if (btn.dataset.type === oscType) { btn.classList.add('active'); } else { btn.classList.remove('active'); }
  btn.addEventListener('click', () => {
    document.querySelectorAll('.osc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    oscType = btn.dataset.type;
    localStorage.setItem(STORAGE_PREFIX + 'oscType', oscType);
  });
});

// Filter sliders
document.getElementById('filterCutoff').addEventListener('input', (e) => {
  document.getElementById('cutoffVal').textContent = e.target.value;
  if (filter) filter.frequency.value = parseFloat(e.target.value);
});
document.getElementById('filterRes').addEventListener('input', (e) => {
  document.getElementById('resVal').textContent = parseFloat(e.target.value).toFixed(1);
  if (filter) filter.Q.value = parseFloat(e.target.value);
});

// Envelope sliders
['A','D','S','R'].forEach(p => {
  const el = document.getElementById('env' + p);
  const valEl = document.getElementById('env' + p + 'Val');
  el.addEventListener('input', () => {
    valEl.textContent = p === 'S' ? parseFloat(el.value).toFixed(2) : parseFloat(el.value).toFixed(2) + 's';
  });
});

// Keyboard input
const keyDownMap = {};
function getKeyNoteIdx(key) {
  const k = key.toLowerCase();
  // White keys
  const wIdx = WHITE_KEYS.indexOf(k);
  if (wIdx !== -1 && wIdx < whiteNotes.length) {
    return notes.indexOf(whiteNotes[wIdx]);
  }
  // Black keys
  if (k in BLACK_KEYS_MAP) {
    const bIdx = BLACK_KEYS_MAP[k];
    if (bIdx < blackNotes.length) {
      return notes.indexOf(blackNotes[bIdx]);
    }
  }
  return -1;
}

document.addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const idx = getKeyNoteIdx(e.key);
  if (idx >= 0 && !keyDownMap[e.key]) {
    keyDownMap[e.key] = true;
    noteOn(idx);
  }
});
document.addEventListener('keyup', (e) => {
  const idx = getKeyNoteIdx(e.key);
  if (idx >= 0) {
    delete keyDownMap[e.key];
    noteOff(idx);
  }
});

// Waveform visualization
const canvas = document.getElementById('waveformCanvas');
const canvasCtx = canvas.getContext('2d');

function drawWaveform() {
  requestAnimationFrame(drawWaveform);
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (canvas.width !== w * 2 || canvas.height !== h * 2) {
    canvas.width = w * 2;
    canvas.height = h * 2;
    canvasCtx.scale(2, 2);
  }
  canvasCtx.fillStyle = '#252525';
  canvasCtx.fillRect(0, 0, w, h);

  if (!analyser) return;
  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteTimeDomainData(data);

  canvasCtx.lineWidth = 2;
  canvasCtx.strokeStyle = '#8b5cf6';
  canvasCtx.beginPath();
  const sliceWidth = w / bufLen;
  let x = 0;
  for (let i = 0; i < bufLen; i++) {
    const v = data[i] / 128.0;
    const y = (v * h) / 2;
    if (i === 0) canvasCtx.moveTo(x, y);
    else canvasCtx.lineTo(x, y);
    x += sliceWidth;
  }
  canvasCtx.lineTo(w, h / 2);
  canvasCtx.stroke();
}
drawWaveform();

buildKeyboard();
</script>
<script src="/related.js"></script>
</body>
</html>
