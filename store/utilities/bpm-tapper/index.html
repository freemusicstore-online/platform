<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>BPM Tapper - FreeMusicStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0a0a0a;
  color: #e5e5e5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
a { color: #8b5cf6; text-decoration: none; }
a:hover { text-decoration: underline; }
.back { position: absolute; top: 1.25rem; left: 1.25rem; font-size: 0.875rem; font-weight: 500; }
.back::before { content: '\2190 '; }
header { text-align: center; padding: 3rem 1rem 1.5rem; }
header h1 { font-size: 1.5rem; font-weight: 800; color: #fff; }
header p { font-size: 0.875rem; color: #a3a3a3; margin-top: 0.25rem; }
.container { width: 100%; max-width: 420px; padding: 0 1rem 3rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
.bpm-display { text-align: center; }
.bpm-value { font-size: 6rem; font-weight: 800; color: #fff; line-height: 1; min-height: 6rem; }
.bpm-label { font-size: 0.875rem; color: #a3a3a3; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; }
.ms-display { font-size: 0.875rem; color: #525252; margin-top: 0.25rem; }
.tap-btn {
  font-family: 'Manrope', sans-serif; width: 160px; height: 160px; border-radius: 50%;
  background: #1a1a1a; border: 3px solid #8b5cf6; color: #8b5cf6;
  font-size: 1.25rem; font-weight: 700; cursor: pointer;
  transition: transform 0.08s, background 0.08s;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.tap-btn:active { transform: scale(0.95); background: #8b5cf6; color: #fff; }
.actions { display: flex; gap: 0.75rem; }
.btn {
  font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 0.875rem;
  padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn-secondary { background: #262626; color: #e5e5e5; }
.btn-copy { background: #8b5cf6; color: #fff; }
.btn-copy.copied { background: #22c55e; }
.history-section { width: 100%; }
.history-title { font-size: 0.75rem; color: #525252; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
.history-bars { display: flex; align-items: flex-end; gap: 4px; height: 80px; width: 100%; }
.history-bar {
  flex: 1; background: #8b5cf6; border-radius: 2px 2px 0 0; min-height: 4px;
  transition: height 0.2s; position: relative;
}
.history-bar .bar-label {
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-size: 0.5rem; color: #525252; white-space: nowrap;
}
.hint { font-size: 0.75rem; color: #404040; text-align: center; }
</style>
</head>
<body>
<a href="/" class="back">&larr; Back to Store</a>
<header>
  <h1>BPM Tapper</h1>
  <p>Tap to detect tempo</p>
</header>
<div class="container">
  <div class="bpm-display">
    <div class="bpm-value" id="bpmValue">--</div>
    <div class="bpm-label">BPM</div>
    <div class="ms-display" id="msDisplay">Tap to start</div>
  </div>

  <button class="tap-btn" id="tapBtn">TAP</button>

  <div class="actions">
    <button class="btn btn-secondary" id="resetBtn">Reset</button>
    <button class="btn btn-copy" id="copyBtn">Copy BPM</button>
  </div>

  <div class="history-section">
    <div class="history-title">Tap Intervals</div>
    <div class="history-bars" id="historyBars"></div>
  </div>

  <div class="hint">Press spacebar or tap the button</div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'fmus-bpm-tapper';
  const MAX_TAPS = 8;

  let tapTimes = [];
  let resetTimer = null;
  let currentBpm = null;

  const bpmValue = document.getElementById('bpmValue');
  const msDisplay = document.getElementById('msDisplay');
  const tapBtn = document.getElementById('tapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const copyBtn = document.getElementById('copyBtn');
  const historyBars = document.getElementById('historyBars');

  function tap() {
    const now = performance.now();

    // Auto-reset after 3 seconds of no taps
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(reset, 3000);

    tapTimes.push(now);
    if (tapTimes.length > MAX_TAPS + 1) tapTimes = tapTimes.slice(-(MAX_TAPS + 1));

    if (tapTimes.length >= 2) {
      const intervals = [];
      for (let i = 1; i < tapTimes.length; i++) {
        intervals.push(tapTimes[i] - tapTimes[i - 1]);
      }
      const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      currentBpm = Math.round(60000 / avg);
      bpmValue.textContent = currentBpm;
      msDisplay.textContent = Math.round(avg) + ' ms between taps';
      updateHistory(intervals);
      saveState();
    } else {
      msDisplay.textContent = 'Keep tapping...';
    }

    // Visual feedback
    tapBtn.style.transform = 'scale(0.95)';
    tapBtn.style.background = '#8b5cf6';
    tapBtn.style.color = '#fff';
    setTimeout(() => {
      tapBtn.style.transform = '';
      tapBtn.style.background = '';
      tapBtn.style.color = '';
    }, 80);
  }

  function updateHistory(intervals) {
    historyBars.innerHTML = '';
    if (intervals.length === 0) return;
    const maxMs = Math.max(...intervals);
    intervals.forEach((ms, i) => {
      const bar = document.createElement('div');
      bar.className = 'history-bar';
      const height = Math.max(4, (ms / maxMs) * 72);
      bar.style.height = height + 'px';
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = Math.round(ms);
      bar.appendChild(label);
      historyBars.appendChild(bar);
    });
  }

  function reset() {
    tapTimes = [];
    currentBpm = null;
    bpmValue.textContent = '--';
    msDisplay.textContent = 'Tap to start';
    historyBars.innerHTML = '';
    if (resetTimer) clearTimeout(resetTimer);
  }

  function saveState() {
    if (currentBpm) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ lastBpm: currentBpm }));
    }
  }

  tapBtn.addEventListener('click', tap);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      tap();
    }
  });

  copyBtn.addEventListener('click', () => {
    if (!currentBpm) return;
    navigator.clipboard.writeText(String(currentBpm)).then(() => {
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy BPM';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  });
})();
</script>
<script src="/related.js"></script>
</body>
</html>
