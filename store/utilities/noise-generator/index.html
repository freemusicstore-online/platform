<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Noise Generator - FreeMusicStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0a0a0a;
  color: #e5e5e5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
a { color: #8b5cf6; text-decoration: none; }
a:hover { text-decoration: underline; }
.back { position: absolute; top: 1.25rem; left: 1.25rem; font-size: 0.875rem; font-weight: 500; }
.back::before { content: '\2190 '; }
header { text-align: center; padding: 3rem 1rem 1.5rem; }
header h1 { font-size: 1.5rem; font-weight: 800; color: #fff; }
header p { font-size: 0.875rem; color: #a3a3a3; margin-top: 0.25rem; }
.container { width: 100%; max-width: 420px; padding: 0 1rem 3rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
.waveform-container {
  width: 100%; height: 120px; background: #111; border-radius: 0.75rem;
  overflow: hidden; position: relative;
}
canvas { width: 100%; height: 100%; display: block; }
.play-btn {
  font-family: 'Manrope', sans-serif; width: 80px; height: 80px; border-radius: 50%;
  background: #8b5cf6; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
  transition: transform 0.1s, background 0.1s;
  display: flex; align-items: center; justify-content: center;
}
.play-btn:hover { transform: scale(1.05); }
.play-btn.active { background: #7c3aed; }
.play-icon { width: 24px; height: 24px; }
.noise-types { display: flex; gap: 0.5rem; width: 100%; }
.noise-type {
  flex: 1; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 0.8125rem;
  padding: 0.625rem; border-radius: 0.5rem; border: 2px solid #262626;
  background: #111; color: #a3a3a3; cursor: pointer; text-align: center;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.noise-type.selected { border-color: #8b5cf6; color: #fff; background: rgba(139,92,246,0.1); }
.noise-type .type-label { font-size: 0.6875rem; color: #525252; margin-top: 0.125rem; font-weight: 400; }
.noise-type.selected .type-label { color: #8b5cf6; }
.control-group { width: 100%; }
.control-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem; }
.control-name { font-size: 0.875rem; color: #a3a3a3; }
.control-value { font-size: 0.875rem; font-weight: 600; color: #e5e5e5; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  background: #262626; border-radius: 3px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: #8b5cf6; cursor: pointer; border: none;
}
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%; background: #8b5cf6; cursor: pointer; border: none;
}
.timer-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.timer-label { font-size: 0.875rem; color: #a3a3a3; }
select {
  font-family: 'Manrope', sans-serif; font-size: 0.875rem; font-weight: 500;
  background: #1a1a1a; color: #e5e5e5; border: 1px solid #333; border-radius: 0.375rem;
  padding: 0.375rem 0.75rem; cursor: pointer;
}
.toggle-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.toggle-text { font-size: 0.875rem; color: #a3a3a3; }
.toggle { position: relative; width: 44px; height: 24px; cursor: pointer; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider {
  position: absolute; inset: 0; background: #333; border-radius: 12px; transition: background 0.2s;
}
.toggle .slider::before {
  content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; transition: transform 0.2s;
}
.toggle input:checked + .slider { background: #8b5cf6; }
.toggle input:checked + .slider::before { transform: translateX(20px); }
.timer-display { font-size: 0.875rem; color: #525252; text-align: center; min-height: 1.25rem; }
</style>
</head>
<body>
<a href="/" class="back">&larr; Back to Store</a>
<header>
  <h1>Noise Generator</h1>
  <p>White, pink, and brown noise for focus and relaxation</p>
</header>
<div class="container">
  <div class="waveform-container">
    <canvas id="waveformCanvas"></canvas>
  </div>

  <button class="play-btn" id="playBtn">
    <svg class="play-icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
  </button>

  <div class="noise-types">
    <button class="noise-type selected" data-type="white">
      White
      <div class="type-label">All frequencies</div>
    </button>
    <button class="noise-type" data-type="pink">
      Pink
      <div class="type-label">Natural, warm</div>
    </button>
    <button class="noise-type" data-type="brown">
      Brown
      <div class="type-label">Deep, rumble</div>
    </button>
  </div>

  <div class="control-group">
    <div class="control-label">
      <span class="control-name">Volume</span>
      <span class="control-value" id="volumeValue">50%</span>
    </div>
    <input type="range" id="volumeSlider" min="0" max="100" value="50">
  </div>

  <div class="timer-row">
    <span class="timer-label">Auto-stop Timer</span>
    <select id="timerSelect">
      <option value="0">Continuous</option>
      <option value="5">5 minutes</option>
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60">1 hour</option>
    </select>
  </div>

  <div class="toggle-row">
    <span class="toggle-text">Fade out (last 10s)</span>
    <label class="toggle">
      <input type="checkbox" id="fadeToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="timer-display" id="timerDisplay"></div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'fmus-noise-generator';

  let audioCtx = null;
  let noiseNode = null;
  let gainNode = null;
  let analyser = null;
  let isPlaying = false;
  let noiseType = 'white';
  let volume = 50;
  let timerMinutes = 0;
  let fadeOut = true;
  let timerInterval = null;
  let stopTimeout = null;
  let fadeInterval = null;
  let startTime = 0;
  let rafId = null;

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeValue = document.getElementById('volumeValue');
  const timerSelect = document.getElementById('timerSelect');
  const fadeToggle = document.getElementById('fadeToggle');
  const timerDisplay = document.getElementById('timerDisplay');
  const canvas = document.getElementById('waveformCanvas');
  const ctx2d = canvas.getContext('2d');
  const typeButtons = document.querySelectorAll('.noise-type');

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        noiseType = saved.noiseType || 'white';
        volume = saved.volume != null ? saved.volume : 50;
        timerMinutes = saved.timer || 0;
        fadeOut = saved.fadeOut !== false;
      }
    } catch(e) {}
    volumeSlider.value = volume;
    volumeValue.textContent = volume + '%';
    timerSelect.value = timerMinutes;
    fadeToggle.checked = fadeOut;
    typeButtons.forEach(b => b.classList.toggle('selected', b.dataset.type === noiseType));
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ noiseType, volume, timer: timerMinutes, fadeOut }));
  }

  function createNoiseProcessor(ctx) {
    const bufferSize = 4096;
    const processor = ctx.createScriptProcessor(bufferSize, 1, 1);

    // Pink noise state (Paul Kellet's method)
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    // Brown noise state
    let lastBrown = 0;

    processor.onaudioprocess = function(e) {
      const output = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;

        if (noiseType === 'white') {
          output[i] = white;
        } else if (noiseType === 'pink') {
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
          b6 = white * 0.115926;
        } else {
          lastBrown = (lastBrown + (0.02 * white)) / 1.02;
          output[i] = lastBrown * 3.5;
        }
      }
    };

    return processor;
  }

  function start() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    gainNode = audioCtx.createGain();
    gainNode.gain.value = volume / 100;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;

    noiseNode = createNoiseProcessor(audioCtx);
    noiseNode.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    isPlaying = true;
    playIcon.innerHTML = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';
    playBtn.classList.add('active');

    startTime = Date.now();
    startTimer();
    drawWaveform();
  }

  function stop() {
    isPlaying = false;
    if (noiseNode) { noiseNode.disconnect(); noiseNode = null; }
    if (gainNode) { gainNode.disconnect(); gainNode = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    clearTimers();

    playIcon.innerHTML = '<polygon points="6,3 20,12 6,21"/>';
    playBtn.classList.remove('active');
    timerDisplay.textContent = '';
    drawStaticWaveform();
  }

  function startTimer() {
    clearTimers();
    if (timerMinutes <= 0) return;

    const totalMs = timerMinutes * 60 * 1000;
    const fadeMs = fadeOut ? 10000 : 0;

    timerInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, totalMs - elapsed);
      const min = Math.floor(remaining / 60000);
      const sec = Math.floor((remaining % 60000) / 1000);
      timerDisplay.textContent = min + ':' + String(sec).padStart(2, '0') + ' remaining';
    }, 500);

    if (fadeOut && totalMs > fadeMs) {
      setTimeout(() => {
        if (!isPlaying || !gainNode) return;
        const fadeStart = gainNode.gain.value;
        gainNode.gain.setValueAtTime(fadeStart, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 10);
      }, totalMs - fadeMs);
    }

    stopTimeout = setTimeout(() => { stop(); }, totalMs);
  }

  function clearTimers() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (stopTimeout) { clearTimeout(stopTimeout); stopTimeout = null; }
    if (fadeInterval) { clearInterval(fadeInterval); fadeInterval = null; }
  }

  function resizeCanvas() {
    canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
    canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
  }

  function drawWaveform() {
    if (!isPlaying || !analyser) return;
    resizeCanvas();
    const w = canvas.width;
    const h = canvas.height;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(dataArray);

    ctx2d.fillStyle = '#111';
    ctx2d.fillRect(0, 0, w, h);

    ctx2d.lineWidth = 2 * (window.devicePixelRatio || 1);
    ctx2d.strokeStyle = '#8b5cf6';
    ctx2d.beginPath();

    const sliceWidth = w / bufferLength;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
      const v = dataArray[i] / 128.0;
      const y = (v * h) / 2;
      if (i === 0) ctx2d.moveTo(x, y);
      else ctx2d.lineTo(x, y);
      x += sliceWidth;
    }
    ctx2d.lineTo(w, h / 2);
    ctx2d.stroke();

    rafId = requestAnimationFrame(drawWaveform);
  }

  function drawStaticWaveform() {
    resizeCanvas();
    const w = canvas.width;
    const h = canvas.height;
    ctx2d.fillStyle = '#111';
    ctx2d.fillRect(0, 0, w, h);
    ctx2d.strokeStyle = '#1a1a1a';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(0, h / 2);
    ctx2d.lineTo(w, h / 2);
    ctx2d.stroke();
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) stop(); else start();
  });

  typeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      noiseType = btn.dataset.type;
      typeButtons.forEach(b => b.classList.toggle('selected', b === btn));
      saveState();
    });
  });

  volumeSlider.addEventListener('input', () => {
    volume = parseInt(volumeSlider.value);
    volumeValue.textContent = volume + '%';
    if (gainNode) gainNode.gain.value = volume / 100;
    saveState();
  });

  timerSelect.addEventListener('change', () => {
    timerMinutes = parseInt(timerSelect.value);
    if (isPlaying) { startTime = Date.now(); startTimer(); }
    saveState();
  });

  fadeToggle.addEventListener('change', () => {
    fadeOut = fadeToggle.checked;
    saveState();
  });

  window.addEventListener('resize', () => {
    if (!isPlaying) drawStaticWaveform();
  });

  loadState();
  drawStaticWaveform();
})();
</script>
<script src="/related.js"></script>
</body>
</html>
