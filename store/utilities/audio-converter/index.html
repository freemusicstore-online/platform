<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Audio Converter - FreeMusicStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0a0a0a;
  color: #e5e5e5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
a { color: #8b5cf6; text-decoration: none; }
a:hover { text-decoration: underline; }
.back { position: absolute; top: 1.25rem; left: 1.25rem; font-size: 0.875rem; font-weight: 500; }
.back::before { content: '\2190 '; }
header { text-align: center; padding: 3rem 1rem 1.5rem; }
header h1 { font-size: 1.5rem; font-weight: 800; color: #fff; }
header p { font-size: 0.875rem; color: #a3a3a3; margin-top: 0.25rem; }
.container { width: 100%; max-width: 480px; padding: 0 1rem 3rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
.drop-zone {
  width: 100%; border: 2px dashed #333; border-radius: 0.75rem; padding: 3rem 1.5rem;
  text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.drop-zone:hover, .drop-zone.dragover { border-color: #8b5cf6; background: rgba(139,92,246,0.05); }
.drop-zone .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.drop-zone .label { font-size: 0.875rem; color: #a3a3a3; }
.drop-zone .label strong { color: #8b5cf6; }
.file-input { display: none; }
.file-info {
  width: 100%; background: #111; border: 1px solid #222; border-radius: 0.5rem;
  padding: 1rem; display: none;
}
.file-info.visible { display: block; }
.file-info h3 { font-size: 0.875rem; font-weight: 700; color: #fff; margin-bottom: 0.75rem; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.info-item { }
.info-label { font-size: 0.625rem; color: #525252; text-transform: uppercase; letter-spacing: 0.05em; }
.info-value { font-size: 0.875rem; font-weight: 600; color: #e5e5e5; }
.convert-section { width: 100%; display: none; flex-direction: column; gap: 1rem; }
.convert-section.visible { display: flex; }
.format-row { display: flex; align-items: center; justify-content: space-between; }
.format-label { font-size: 0.875rem; color: #a3a3a3; }
select {
  font-family: 'Manrope', sans-serif; font-size: 0.875rem; font-weight: 500;
  background: #1a1a1a; color: #e5e5e5; border: 1px solid #333; border-radius: 0.375rem;
  padding: 0.375rem 0.75rem; cursor: pointer;
}
.btn {
  font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 0.875rem;
  padding: 0.75rem 2rem; border-radius: 0.5rem; border: none; cursor: pointer;
  transition: opacity 0.15s; width: 100%;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: #8b5cf6; color: #fff; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-download { background: #22c55e; color: #fff; display: none; }
.btn-download.visible { display: block; }
.progress-bar {
  width: 100%; height: 4px; background: #262626; border-radius: 2px; overflow: hidden;
  display: none;
}
.progress-bar.visible { display: block; }
.progress-fill { height: 100%; background: #8b5cf6; border-radius: 2px; width: 0; transition: width 0.3s; }
.status { font-size: 0.875rem; color: #525252; text-align: center; min-height: 1.25rem; }
</style>
</head>
<body>
<a href="/" class="back">&larr; Back to Store</a>
<header>
  <h1>Audio Converter</h1>
  <p>Convert between audio formats in your browser</p>
</header>
<div class="container">
  <div class="drop-zone" id="dropZone">
    <div class="icon">&#127925;</div>
    <div class="label">Drop audio file here or <strong>browse</strong></div>
    <div class="label" style="margin-top:0.25rem; font-size:0.75rem">WAV, MP3, OGG, WebM</div>
  </div>
  <input type="file" class="file-input" id="fileInput" accept="audio/*">

  <div class="file-info" id="fileInfo">
    <h3 id="fileName">file.wav</h3>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Duration</div>
        <div class="info-value" id="infoDuration">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">Sample Rate</div>
        <div class="info-value" id="infoSampleRate">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">Channels</div>
        <div class="info-value" id="infoChannels">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">File Size</div>
        <div class="info-value" id="infoSize">--</div>
      </div>
    </div>
  </div>

  <div class="convert-section" id="convertSection">
    <div class="format-row">
      <span class="format-label">Output Format</span>
      <select id="outputFormat">
        <option value="wav">WAV</option>
        <option value="webm">WebM (Opus)</option>
        <option value="ogg">OGG (if supported)</option>
        <option value="mp3">MP3 (if supported)</option>
      </select>
    </div>
    <button class="btn btn-primary" id="convertBtn">Convert</button>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <button class="btn btn-download" id="downloadBtn">Download</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'fmus-audio-converter';

  let audioBuffer = null;
  let sourceFile = null;
  let convertedBlob = null;

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const convertSection = document.getElementById('convertSection');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const outputFormat = document.getElementById('outputFormat');
  const statusEl = document.getElementById('status');

  function formatDuration(s) {
    const min = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return min + ':' + String(sec).padStart(2, '0');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  async function handleFile(file) {
    sourceFile = file;
    statusEl.textContent = 'Decoding audio...';
    downloadBtn.classList.remove('visible');
    convertedBlob = null;

    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuf = await file.arrayBuffer();
      audioBuffer = await ctx.decodeAudioData(arrayBuf);
      ctx.close();

      fileName.textContent = file.name;
      document.getElementById('infoDuration').textContent = formatDuration(audioBuffer.duration);
      document.getElementById('infoSampleRate').textContent = audioBuffer.sampleRate + ' Hz';
      document.getElementById('infoChannels').textContent = audioBuffer.numberOfChannels === 1 ? 'Mono' : audioBuffer.numberOfChannels === 2 ? 'Stereo' : audioBuffer.numberOfChannels + 'ch';
      document.getElementById('infoSize').textContent = formatSize(file.size);

      fileInfo.classList.add('visible');
      convertSection.classList.add('visible');
      statusEl.textContent = 'Ready to convert';
    } catch(e) {
      statusEl.textContent = 'Error: Could not decode audio file';
      fileInfo.classList.remove('visible');
      convertSection.classList.remove('visible');
    }
  }

  function encodeWAV(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const length = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = length * blockAlign;
    const headerSize = 44;
    const output = new ArrayBuffer(headerSize + dataSize);
    const view = new DataView(output);

    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, dataSize, true);

    const channels = [];
    for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));

    let offset = 44;
    for (let i = 0; i < length; i++) {
      for (let c = 0; c < numChannels; c++) {
        let sample = channels[c][i];
        sample = Math.max(-1, Math.min(1, sample));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
      }
    }

    return new Blob([output], { type: 'audio/wav' });
  }

  async function encodeMediaRecorder(buffer, mimeType) {
    const offlineCtx = new OfflineAudioContext(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = buffer;
    const dest = offlineCtx.createMediaStreamDestination();
    source.connect(dest);
    source.connect(offlineCtx);
    source.start();

    return new Promise((resolve, reject) => {
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        reject(new Error('Format not supported by this browser'));
        return;
      }

      const recorder = new MediaRecorder(dest.stream, { mimeType });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
      recorder.onerror = (e) => reject(e.error || new Error('Encoding failed'));
      recorder.start();
      offlineCtx.startRendering().then(() => {
        setTimeout(() => recorder.stop(), 100);
      });
    });
  }

  convertBtn.addEventListener('click', async () => {
    if (!audioBuffer) return;
    const format = outputFormat.value;
    convertBtn.disabled = true;
    downloadBtn.classList.remove('visible');
    progressBar.classList.add('visible');
    progressFill.style.width = '30%';
    statusEl.textContent = 'Converting...';

    try {
      let blob;
      if (format === 'wav') {
        progressFill.style.width = '60%';
        blob = encodeWAV(audioBuffer);
      } else {
        const mimeMap = { webm: 'audio/webm;codecs=opus', ogg: 'audio/ogg;codecs=opus', mp3: 'audio/mpeg' };
        const mime = mimeMap[format];

        // Try the requested format, fall back to webm
        let usedMime = mime;
        if (!MediaRecorder.isTypeSupported(mime)) {
          if (format !== 'webm' && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            usedMime = 'audio/webm;codecs=opus';
            statusEl.textContent = format.toUpperCase() + ' not supported, using WebM...';
          } else {
            throw new Error(format.toUpperCase() + ' is not supported in this browser. Try WAV.');
          }
        }
        progressFill.style.width = '50%';
        blob = await encodeMediaRecorder(audioBuffer, usedMime);
      }

      progressFill.style.width = '100%';
      convertedBlob = blob;
      statusEl.textContent = 'Done! ' + formatSize(blob.size);
      downloadBtn.classList.add('visible');

      // Save last used format
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ lastFormat: format }));
    } catch(e) {
      statusEl.textContent = 'Error: ' + e.message;
    }

    convertBtn.disabled = false;
    setTimeout(() => { progressBar.classList.remove('visible'); progressFill.style.width = '0'; }, 1000);
  });

  downloadBtn.addEventListener('click', () => {
    if (!convertedBlob || !sourceFile) return;
    const format = outputFormat.value;
    const ext = format === 'wav' ? '.wav' : format === 'webm' ? '.webm' : format === 'ogg' ? '.ogg' : '.mp3';
    const baseName = sourceFile.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(convertedBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = baseName + ext;
    a.click();
    URL.revokeObjectURL(url);
  });

  // Restore last format
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.lastFormat) outputFormat.value = saved.lastFormat;
  } catch(e) {}
})();
</script>
<script src="/related.js"></script>
</body>
</html>
