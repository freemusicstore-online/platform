<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — FreeMusicStore</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #0a0a0b; color: #f0f0f2;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }
    .code {
      font-family: 'Fraunces', serif; font-size: 6rem; font-weight: 700;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1; margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #8a8a8e; font-size: 1rem; margin-bottom: 2rem; max-width: 400px; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The music tool you're looking for doesn't exist or may have been moved.</p>
  <a href="/">Back to FreeMusicStore</a>
</body>
</html>
