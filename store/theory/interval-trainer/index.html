<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Interval Trainer - FreeMusicStore</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
  line-height: 1.5;
}
a { color: #8b5cf6; text-decoration: none; }
a:hover { text-decoration: underline; }
.back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 16px 24px; font-size: 14px; font-weight: 500; color: #999;
}
.back:hover { color: #8b5cf6; text-decoration: none; }
header {
  text-align: center; padding: 24px 24px 32px;
  border-bottom: 1px solid #1e1e1e;
}
header h1 { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 6px; }
header p { color: #888; font-size: 15px; }
.container { max-width: 600px; margin: 0 auto; padding: 24px; }
.mode-selector {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;
}
.mode-btn {
  font-family: 'Manrope', sans-serif;
  background: #1a1a1a; color: #aaa;
  border: 1px solid #333; border-radius: 8px;
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.mode-btn:hover { border-color: #8b5cf6; color: #ccc; }
.mode-btn.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
.stats-bar {
  display: flex; justify-content: center; gap: 24px; margin-bottom: 24px;
}
.stat { text-align: center; }
.stat-value { font-size: 28px; font-weight: 800; color: #fff; }
.stat-value.accent { color: #8b5cf6; }
.stat-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.8px; }
.play-area {
  background: #1a1a1a; border: 1px solid #262626;
  border-radius: 16px; padding: 32px; text-align: center;
  margin-bottom: 24px;
}
.play-btn {
  font-family: 'Manrope', sans-serif;
  background: #8b5cf6; color: #fff; border: none;
  border-radius: 50%; width: 80px; height: 80px;
  font-size: 28px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.15s; margin-bottom: 16px;
}
.play-btn:hover { background: #7c3aed; transform: scale(1.05); }
.play-btn:active { transform: scale(0.95); }
.play-hint { font-size: 13px; color: #666; margin-top: 4px; }
.answer-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 16px;
}
.answer-btn {
  font-family: 'Manrope', sans-serif;
  background: #1a1a1a; color: #ccc;
  border: 1px solid #333; border-radius: 10px;
  padding: 12px 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.answer-btn:hover { border-color: #8b5cf6; background: #1e1a2e; }
.answer-btn.correct {
  background: #064e3b; border-color: #10b981; color: #34d399;
  animation: flash-correct 0.3s;
}
.answer-btn.wrong {
  background: #4c0519; border-color: #ef4444; color: #f87171;
  animation: flash-wrong 0.3s;
}
.answer-btn.reveal {
  background: #1e1a2e; border-color: #8b5cf6; color: #8b5cf6;
}
.answer-btn:disabled { cursor: default; opacity: 0.7; }
@keyframes flash-correct { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes flash-wrong { 0% { transform: translateX(-4px); } 25% { transform: translateX(4px); } 50% { transform: translateX(-4px); } 75% { transform: translateX(4px); } 100% { transform: translateX(0); } }
.feedback {
  font-size: 18px; font-weight: 700; min-height: 32px;
  margin-bottom: 16px;
}
.feedback.correct { color: #34d399; }
.feedback.wrong { color: #f87171; }
.action-btns { display: flex; gap: 8px; justify-content: center; }
.action-btn {
  font-family: 'Manrope', sans-serif;
  background: #262626; color: #ccc; border: none;
  border-radius: 8px; padding: 10px 20px;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.action-btn:hover { background: #333; }
.action-btn.primary { background: #8b5cf6; color: #fff; }
.action-btn.primary:hover { background: #7c3aed; }
.streak-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 16px;
}
.streak-label { font-size: 12px; color: #666; font-weight: 600; }
.streak-count { font-size: 16px; font-weight: 800; color: #f59e0b; }
</style>
</head>
<body>
<a href="/" class="back">&larr; Back to Store</a>
<header>
  <h1>Interval Trainer</h1>
  <p>Train your ear to identify musical intervals</p>
</header>
<div class="container">
  <div class="mode-selector">
    <button class="mode-btn active" data-mode="ascending">Ascending</button>
    <button class="mode-btn" data-mode="descending">Descending</button>
    <button class="mode-btn" data-mode="harmonic">Harmonic</button>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="scoreCorrect">0</div>
      <div class="stat-label">Correct</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="scoreTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-value accent" id="scoreAccuracy">0%</div>
      <div class="stat-label">Accuracy</div>
    </div>
  </div>

  <div class="streak-bar">
    <span class="streak-label">Streak:</span>
    <span class="streak-count" id="streakCount">0</span>
  </div>

  <div class="play-area">
    <button class="play-btn" id="playBtn" title="Play interval">&#9654;</button>
    <div class="play-hint" id="playHint">Press to hear the interval</div>
    <div class="feedback" id="feedback"></div>
    <div class="answer-grid" id="answerGrid"></div>
    <div class="action-btns">
      <button class="action-btn" id="replayBtn">Replay</button>
      <button class="action-btn primary" id="nextBtn">Next</button>
    </div>
  </div>
</div>

<script>
const INTERVALS = [
  { semitones: 1,  name: 'Minor 2nd',   short: 'm2' },
  { semitones: 2,  name: 'Major 2nd',   short: 'M2' },
  { semitones: 3,  name: 'Minor 3rd',   short: 'm3' },
  { semitones: 4,  name: 'Major 3rd',   short: 'M3' },
  { semitones: 5,  name: 'Perfect 4th', short: 'P4' },
  { semitones: 6,  name: 'Tritone',     short: 'TT' },
  { semitones: 7,  name: 'Perfect 5th', short: 'P5' },
  { semitones: 8,  name: 'Minor 6th',   short: 'm6' },
  { semitones: 9,  name: 'Major 6th',   short: 'M6' },
  { semitones: 10, name: 'Minor 7th',   short: 'm7' },
  { semitones: 11, name: 'Major 7th',   short: 'M7' },
  { semitones: 12, name: 'Octave',      short: 'P8' },
];

let audioCtx = null;
let mode = 'ascending';
let currentInterval = null;
let currentBase = null;
let correct = 0, total = 0, streak = 0, bestStreak = 0;
let answered = false;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function noteFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

function playTone(midi, startTime, duration) {
  const ctx = getAudioCtx();
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0.2, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = noteFreq(midi);
  osc.connect(gain);
  osc.start(startTime);
  osc.stop(startTime + duration);
  const osc2 = ctx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = noteFreq(midi);
  const g2 = ctx.createGain();
  g2.gain.value = 0.1;
  osc2.connect(g2);
  g2.connect(gain);
  osc2.start(startTime);
  osc2.stop(startTime + duration);
}

function playInterval() {
  if (!currentInterval) return;
  const ctx = getAudioCtx();
  const t = ctx.currentTime + 0.05;
  const semi = currentInterval.semitones;
  const noteDuration = 0.8;

  if (mode === 'ascending') {
    playTone(currentBase, t, noteDuration);
    playTone(currentBase + semi, t + 0.85, noteDuration);
  } else if (mode === 'descending') {
    playTone(currentBase + semi, t, noteDuration);
    playTone(currentBase, t + 0.85, noteDuration);
  } else {
    playTone(currentBase, t, noteDuration * 1.5);
    playTone(currentBase + semi, t, noteDuration * 1.5);
  }
}

function newQuestion() {
  answered = false;
  const idx = Math.floor(Math.random() * INTERVALS.length);
  currentInterval = INTERVALS[idx];
  // Random base note from C3 (48) to C5 (72)
  currentBase = 48 + Math.floor(Math.random() * 24);
  // Make sure second note is in range
  if (currentBase + currentInterval.semitones > 84) {
    currentBase = 84 - currentInterval.semitones;
  }

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('playHint').textContent = 'Press to hear the interval';
  renderAnswerButtons();
  playInterval();
}

function renderAnswerButtons() {
  const grid = document.getElementById('answerGrid');
  grid.innerHTML = '';
  INTERVALS.forEach((interval, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = interval.name;
    btn.disabled = answered;
    btn.addEventListener('click', () => handleAnswer(i, btn));
    grid.appendChild(btn);
  });
}

function handleAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  total++;

  const isCorrect = INTERVALS[idx].semitones === currentInterval.semitones;
  const feedback = document.getElementById('feedback');
  const allBtns = document.querySelectorAll('.answer-btn');

  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    correct++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    btn.classList.add('correct');
    feedback.textContent = 'Correct!';
    feedback.className = 'feedback correct';
  } else {
    streak = 0;
    btn.classList.add('wrong');
    feedback.textContent = `Wrong - it was ${currentInterval.name}`;
    feedback.className = 'feedback wrong';
    // Reveal correct answer
    allBtns.forEach(b => {
      if (b.textContent === currentInterval.name) {
        b.classList.add('reveal');
      }
    });
  }

  updateStats();
  saveStats();
}

function updateStats() {
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  document.getElementById('scoreAccuracy').textContent = pct + '%';
  document.getElementById('streakCount').textContent = streak;
}

function saveStats() {
  localStorage.setItem('fmus-interval-trainer', JSON.stringify({
    correct, total, streak, bestStreak, mode
  }));
}

function loadStats() {
  const saved = localStorage.getItem('fmus-interval-trainer');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      correct = s.correct || 0;
      total = s.total || 0;
      streak = s.streak || 0;
      bestStreak = s.bestStreak || 0;
      if (s.mode) {
        mode = s.mode;
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.mode === mode);
        });
      }
    } catch(e) {}
  }
  updateStats();
}

// Mode selector
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    saveStats();
  });
});

document.getElementById('playBtn').addEventListener('click', () => {
  if (!currentInterval) {
    newQuestion();
  } else {
    playInterval();
  }
});

document.getElementById('replayBtn').addEventListener('click', () => {
  if (currentInterval) playInterval();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  newQuestion();
});

loadStats();
newQuestion();
</script>
<script src="/related.js"></script>
</body>
</html>
