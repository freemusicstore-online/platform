<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Sample Library - FreeMusicStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #8b5cf6;
  --accent-hover: #7c3aed;
  --accent-dim: #8b5cf630;
  --bg: #0a0a0b;
  --surface: #141416;
  --surface-2: #1e1e22;
  --border: #2a2a2e;
  --text: #f0f0f2;
  --text-dim: #8a8a8e;
  --green: #22c55e;
  --red: #ef4444;
}
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Back link */
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 16px 24px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-dim);
}
.back:hover { color: var(--accent); text-decoration: none; }

/* Header */
header {
  text-align: center;
  padding: 0 24px 28px;
}
header h1 {
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
}
header p { color: var(--text-dim); font-size: 15px; }
.stats {
  display: flex;
  gap: 24px;
  justify-content: center;
  margin-top: 14px;
  flex-wrap: wrap;
}
.stat {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
}
.stat strong {
  color: var(--accent);
  font-weight: 800;
}

/* Layout */
.app-layout {
  display: flex;
  min-height: calc(100vh - 180px);
}

/* Sidebar */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h3 {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
}
.sidebar-search {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px;
  font-family: 'Manrope', sans-serif;
}
.sidebar-search:focus { outline: none; border-color: var(--accent); }
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.sidebar-list::-webkit-scrollbar { width: 6px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.pack-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: #bbb;
  transition: all 0.15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.pack-item:hover { background: var(--surface-2); color: #fff; }
.pack-item.active { background: var(--accent-dim); color: var(--accent); }
.pack-name { font-weight: 600; }
.pack-count {
  font-size: 11px;
  font-weight: 700;
  background: var(--surface-2);
  padding: 2px 7px;
  border-radius: 10px;
  color: var(--text-dim);
  min-width: 24px;
  text-align: center;
}
.pack-item.active .pack-count {
  background: var(--accent);
  color: #fff;
}

/* Main panel */
.main-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.toolbar-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}
.toolbar-separator {
  width: 1px;
  height: 26px;
  background: var(--border);
}

/* Volume slider */
.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

/* Buttons */
.btn {
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--border); }
.btn-danger {
  background: var(--red);
  color: #fff;
}
.btn-danger:hover { background: #dc2626; }
.btn-sm {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 6px;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Pack header */
.pack-header {
  padding: 20px 24px 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.pack-header h2 {
  font-size: 22px;
  font-weight: 800;
  color: #fff;
}
.pack-header .pack-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 4px;
}

/* Sample grid */
.samples-container {
  flex: 1;
  overflow-y: auto;
  padding: 0 24px 32px;
}
.samples-container::-webkit-scrollbar { width: 6px; }
.samples-container::-webkit-scrollbar-track { background: transparent; }
.samples-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.samples-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.sample-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  transition: border-color 0.15s, background 0.15s;
}
.sample-card:hover {
  border-color: #3a3a3e;
  background: var(--surface-2);
}
.sample-card.playing {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.sample-name {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sample-duration {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
}
.waveform-container {
  width: 100%;
  height: 48px;
  margin: 8px 0;
  border-radius: 6px;
  overflow: hidden;
  background: var(--bg);
  cursor: pointer;
  position: relative;
}
.waveform-container canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.waveform-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 11px;
}
.sample-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.sample-actions .btn {
  flex: 1;
  justify-content: center;
}
.loading-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty / search state */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-dim);
}
.empty-state h3 {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
}

/* Mobile */
@media (max-width: 768px) {
  .app-layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    min-width: 100%;
    max-height: none;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-list {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 4px;
    padding: 8px;
  }
  .pack-item { white-space: nowrap; flex-shrink: 0; }
  .samples-grid { grid-template-columns: 1fr; }
  .pack-header { padding: 16px; }
  .samples-container { padding: 0 16px 24px; }
}
</style>
</head>
<body>

<a href="/" class="back">&larr; Back to Store</a>

<header>
  <h1>Sample Library</h1>
  <p>Free synthesized audio samples. Preview, download, and use royalty-free forever.</p>
  <div class="stats">
    <span class="stat"><strong id="totalCount">64</strong> free samples</span>
    <span class="stat"><strong>100%</strong> synthesized</span>
    <span class="stat"><strong>Royalty-free</strong> forever</span>
    <span class="stat"><strong>WAV</strong> 16-bit / 44.1kHz</span>
  </div>
</header>

<div class="app-layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>Sample Packs</h3>
      <input type="text" class="sidebar-search" id="searchInput" placeholder="Search samples...">
    </div>
    <div class="sidebar-list" id="packList"></div>
  </div>

  <div class="main-panel">
    <div class="toolbar">
      <div class="toolbar-group">
        <label>Volume</label>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.75">
      </div>
      <div class="toolbar-separator"></div>
      <button class="btn btn-secondary btn-sm" id="stopAllBtn" title="Stop all playback">Stop All</button>
      <div style="flex:1"></div>
      <button class="btn btn-primary btn-sm" id="downloadAllBtn">Download All</button>
    </div>

    <div id="packHeader" class="pack-header">
      <div>
        <h2 id="packTitle">TR-808 Drum Kit</h2>
        <div class="pack-desc" id="packDesc"></div>
      </div>
    </div>

    <div class="samples-container">
      <div class="samples-grid" id="samplesGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <h3>No samples found</h3>
        <p>Try a different search term.</p>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Audio engine ───────────────────────────────────────────────────
const SAMPLE_RATE = 44100;
let audioCtx = null;
let masterGain = null;
let currentSource = null;
let currentPlayingId = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.75;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ─── Sample cache ───────────────────────────────────────────────────
const bufferCache = {};
const generating = {};

async function getBuffer(sample) {
  const id = sample.id;
  if (bufferCache[id]) return bufferCache[id];
  if (generating[id]) return generating[id];
  generating[id] = (async () => {
    const buf = await sample.generate();
    bufferCache[id] = buf;
    delete generating[id];
    return buf;
  })();
  return generating[id];
}

// ─── WAV encoder ────────────────────────────────────────────────────
function encodeWAV(audioBuffer) {
  const numCh = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;
  const sr = audioBuffer.sampleRate;
  const bitsPerSample = 16;
  const bytesPerSample = bitsPerSample / 8;
  const blockAlign = numCh * bytesPerSample;
  const dataSize = length * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);

  const channels = [];
  for (let c = 0; c < numCh; c++) channels.push(audioBuffer.getChannelData(c));

  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let c = 0; c < numCh; c++) {
      let s = Math.max(-1, Math.min(1, channels[c][i]));
      s = s < 0 ? s * 0x8000 : s * 0x7FFF;
      view.setInt16(offset, s, true);
      offset += 2;
    }
  }
  return buffer;
}

// ─── Waveform rendering ─────────────────────────────────────────────
function drawWaveform(canvas, audioBuffer, isPlaying) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const data = audioBuffer.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length / w));
  const color = isPlaying ? '#8b5cf6' : '#4a4a50';
  const colorPeak = isPlaying ? '#a78bfa' : '#5a5a60';

  ctx.clearRect(0, 0, w, h);
  const mid = h / 2;

  for (let x = 0; x < w; x++) {
    const start = x * step;
    let min = 0, max = 0;
    for (let j = 0; j < step; j++) {
      const val = data[start + j] || 0;
      if (val < min) min = val;
      if (val > max) max = val;
    }
    const top = mid + min * mid * 0.9;
    const bottom = mid + max * mid * 0.9;
    ctx.fillStyle = color;
    ctx.fillRect(x, top, 1, bottom - top || 1);
    // Peak line
    ctx.fillStyle = colorPeak;
    ctx.fillRect(x, top, 1, 1);
    ctx.fillRect(x, bottom - 1, 1, 1);
  }
}

// ─── Synthesis helpers ──────────────────────────────────────────────
function createOffline(duration) {
  return new OfflineAudioContext(1, Math.ceil(SAMPLE_RATE * duration), SAMPLE_RATE);
}

function noiseBuffer(ctx, duration) {
  const len = Math.ceil(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function bitcrush(audioBuffer, bits, downsample) {
  const data = audioBuffer.getChannelData(0);
  const levels = Math.pow(2, bits);
  let hold = 0;
  for (let i = 0; i < data.length; i++) {
    if (i % downsample === 0) {
      hold = Math.round(data[i] * levels) / levels;
    }
    data[i] = hold;
  }
  return audioBuffer;
}

function softClip(audioBuffer, amount) {
  const data = audioBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = Math.tanh(data[i] * amount);
  }
  return audioBuffer;
}

// ─── TR-808 Drum Kit ────────────────────────────────────────────────
const pack808 = {
  id: '808', name: 'TR-808 Drum Kit', desc: 'Classic analog drum machine sounds, synthesized',
  samples: [
    {
      id: '808-kick', name: 'Kick', duration: 0.8,
      async generate() {
        const ctx = createOffline(0.8);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const dist = ctx.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) { const x = (i / 128) - 1; curve[i] = (Math.PI + 3) * x / (Math.PI + 3 * Math.abs(x)); }
        dist.curve = curve;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, 0);
        osc.frequency.exponentialRampToValueAtTime(40, 0.12);
        gain.gain.setValueAtTime(1, 0);
        gain.gain.exponentialRampToValueAtTime(0.001, 0.75);
        osc.connect(dist);
        dist.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0);
        osc.stop(0.8);
        return ctx.startRendering();
      }
    },
    {
      id: '808-snare', name: 'Snare', duration: 0.4,
      async generate() {
        const ctx = createOffline(0.4);
        // Tone
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 200;
        oscGain.gain.setValueAtTime(0.7, 0);
        oscGain.gain.exponentialRampToValueAtTime(0.001, 0.15);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(0); osc.stop(0.4);
        // Noise
        const noiseSrc = ctx.createBufferSource();
        noiseSrc.buffer = noiseBuffer(ctx, 0.4);
        const nGain = ctx.createGain();
        const hpf = ctx.createBiquadFilter();
        hpf.type = 'highpass';
        hpf.frequency.value = 2000;
        nGain.gain.setValueAtTime(0.6, 0);
        nGain.gain.exponentialRampToValueAtTime(0.001, 0.3);
        noiseSrc.connect(hpf);
        hpf.connect(nGain);
        nGain.connect(ctx.destination);
        noiseSrc.start(0); noiseSrc.stop(0.4);
        return ctx.startRendering();
      }
    },
    {
      id: '808-clap', name: 'Clap', duration: 0.3,
      async generate() {
        const ctx = createOffline(0.3);
        const bpf = ctx.createBiquadFilter();
        bpf.type = 'bandpass';
        bpf.frequency.value = 1200;
        bpf.Q.value = 1.5;
        bpf.connect(ctx.destination);
        for (let i = 0; i < 4; i++) {
          const src = ctx.createBufferSource();
          src.buffer = noiseBuffer(ctx, 0.015);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.8, 0);
          g.gain.exponentialRampToValueAtTime(0.001, 0.25);
          src.connect(g);
          g.connect(bpf);
          src.start(i * 0.012);
        }
        // Tail
        const tail = ctx.createBufferSource();
        tail.buffer = noiseBuffer(ctx, 0.3);
        const tGain = ctx.createGain();
        tGain.gain.setValueAtTime(0.5, 0.04);
        tGain.gain.exponentialRampToValueAtTime(0.001, 0.28);
        tail.connect(tGain);
        tGain.connect(bpf);
        tail.start(0.04);
        return ctx.startRendering();
      }
    },
    {
      id: '808-chh', name: 'Closed HiHat', duration: 0.08,
      async generate() {
        const ctx = createOffline(0.08);
        const src = ctx.createBufferSource();
        src.buffer = noiseBuffer(ctx, 0.08);
        const hpf = ctx.createBiquadFilter();
        hpf.type = 'highpass';
        hpf.frequency.value = 7000;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.6, 0);
        gain.gain.exponentialRampToValueAtTime(0.001, 0.06);
        src.connect(hpf);
        hpf.connect(gain);
        gain.connect(ctx.destination);
        src.start(0);
        return ctx.startRendering();
      }
    },
    {
      id: '808-ohh', name: 'Open HiHat', duration: 0.4,
      async generate() {
        const ctx = createOffline(0.4);
        const src = ctx.createBufferSource();
        src.buffer = noiseBuffer(ctx, 0.4);
        const hpf = ctx.createBiquadFilter();
        hpf.type = 'highpass';
        hpf.frequency.value = 7000;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, 0);
        gain.gain.exponentialRampToValueAtTime(0.001, 0.35);
        src.connect(hpf);
        hpf.connect(gain);
        gain.connect(ctx.destination);
        src.start(0);
        return ctx.startRendering();
      }
    },
    {
      id: '808-tom-lo', name: 'Tom Low', duration: 0.5,
      async generate() {
        const ctx = createOffline(0.5);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, 0);
        osc.frequency.exponentialRampToValueAtTime(60, 0.1);
        gain.gain.setValueAtTime(0.8, 0);
        gain.gain.exponentialRampToValueAtTime(0.001, 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0); osc.stop(0.5);
        return ctx.startRendering();
      }
    },
    {
      id: '808-tom-mid', name: 'Tom Mid', duration: 0.45,
      async generate() {
        const ctx = createOffline(0.45);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, 0);
        osc.frequency.exponentialRampToValueAtTime(100, 0.08);
        gain.gain.setValueAtTime(0.8, 0);
        gain.gain.exponentialRampToValueAtTime(0.001, 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0); osc.stop(0.45);
        return ctx.startRendering();
      }
    },
    {
      id: '808-tom-hi', name: 'Tom High', duration: 0.4,
      async generate() {
        const ctx = createOffline(0.4);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(250, 0);
        osc.frequency.exponentialRampToValueAtTime(150, 0.06);

        const ctx = createOffline(dur);
        const len = Math.ceil(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        data[0] = 1.0;
        // Dense, bright — plate character
        for (let i = 0; i < len; i++) {
          const t = i / ctx.sampleRate;
          const decay = Math.exp(-t / 0.6);
          // Plate has very dense early buildup
          const density = i < ctx.sampleRate * 0.05 ? 0.5 : 0.35;
          data[i] += (Math.random() * 2 - 1) * density * decay;
        }
        // Add bright character via filtering
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const hpf = ctx.createBiquadFilter();
        hpf.type = 'highpass';
        hpf.frequency.value = 300;
        const peak = ctx.createBiquadFilter();
        peak.type = 'peaking';
        peak.frequency.value = 4000;
        peak.gain.value = 4;
        src.connect(hpf);
        hpf.connect(peak);
        peak.connect(ctx.destination);
        src.start(0);
        return ctx.startRendering();
      }
    },
    {
      id: 'ir-spring', name: 'Spring Reverb', duration: 1.0,
      async generate() {
        const dur = 1.0;
        const ctx = createOffline(dur);
        const len = Math.ceil(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        data[0] = 1.0;
        // Spring character: initial hit + delayed dense cluster + boing reflections
        for (let i = 0; i < len; i++) {
          const t = i / ctx.sampleRate;
          // Main decay
          data[i] += (Math.random() * 2 - 1) * 0.3 * Math.exp(-t / 0.25);
          // Boing reflections at ~30ms intervals
          if (t > 0.02) {
            const boingPhase = (t - 0.02) * 33; // ~33 Hz boing rate
            const boingAmp = 0.15 * Math.exp(-t / 0.3) * Math.sin(boingPhase * Math.PI * 2);
            data[i] += boingAmp;
          }
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const bpf = ctx.createBiquadFilter();
        bpf.type = 'bandpass';
        bpf.frequency.value = 2500;
        bpf.Q.value = 0.8;
        src.connect(bpf);
        bpf.connect(ctx.destination);
        src.start(0);
        return ctx.startRendering();
      }
    }
  ]
};

// ─── All packs ──────────────────────────────────────────────────────
const allPacks = [pack808, pack909, packAcoustic, packLofi, packSynth, packFX, packIR];
let activePack = allPacks[0];
let searchTerm = '';

// Count total
const totalSamples = allPacks.reduce((s, p) => s + p.samples.length, 0);
document.getElementById('totalCount').textContent = totalSamples;

// ─── Render sidebar ─────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('packList');
  list.innerHTML = '';
  allPacks.forEach(pack => {
    const visibleCount = getFilteredSamples(pack).length;
    const el = document.createElement('div');
    el.className = 'pack-item' + (pack.id === activePack.id ? ' active' : '');
    el.innerHTML = `
      <span class="pack-name">${pack.name}</span>
      <span class="pack-count">${visibleCount}</span>
    `;
    el.onclick = () => {
      activePack = pack;
      renderSidebar();
      renderSamples();
    };
    if (visibleCount > 0 || !searchTerm) list.appendChild(el);
  });
}

// ─── Filter samples ─────────────────────────────────────────────────
function getFilteredSamples(pack) {
  if (!searchTerm) return pack.samples;
  const q = searchTerm.toLowerCase();
  return pack.samples.filter(s =>
    s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || pack.name.toLowerCase().includes(q)
  );
}

// ─── Render samples ─────────────────────────────────────────────────
function renderSamples() {
  const grid = document.getElementById('samplesGrid');
  const empty = document.getElementById('emptyState');
  const title = document.getElementById('packTitle');
  const desc = document.getElementById('packDesc');

  title.textContent = activePack.name;
  desc.textContent = activePack.desc;

  const samples = getFilteredSamples(activePack);
  grid.innerHTML = '';

  if (samples.length === 0) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  samples.forEach(sample => {
    const card = document.createElement('div');
    card.className = 'sample-card';
    card.id = 'card-' + sample.id;
    card.innerHTML = `
      <div class="sample-name">
        <span>${sample.name}</span>
        <span class="sample-duration">${sample.duration.toFixed(2)}s</span>
      </div>
      <div class="waveform-container" data-id="${sample.id}">
        ${bufferCache[sample.id]
          ? '<canvas></canvas>'
          : '<div class="waveform-placeholder">Click to generate</div>'}
      </div>
      <div class="sample-actions">
        <button class="btn btn-secondary btn-sm play-btn" data-id="${sample.id}">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="2,0 12,6 2,12"/></svg>
          Play
        </button>
        <button class="btn btn-primary btn-sm dl-btn" data-id="${sample.id}">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1v7M3 6l3 3 3-3M1 11h10"/></svg>
          WAV
        </button>
      </div>
    `;
    grid.appendChild(card);

    // Draw cached waveform if available
    if (bufferCache[sample.id]) {
      const canvas = card.querySelector('canvas');
      if (canvas) {
        requestAnimationFrame(() => drawWaveform(canvas, bufferCache[sample.id], sample.id === currentPlayingId));
      }
    }

    // Waveform click → play
    card.querySelector('.waveform-container').addEventListener('click', () => playSample(sample));
    card.querySelector('.play-btn').addEventListener('click', () => playSample(sample));
    card.querySelector('.dl-btn').addEventListener('click', () => downloadSample(sample));
  });
}

// ─── Playback ───────────────────────────────────────────────────────
async function playSample(sample) {
  const ctx = getAudioCtx();

  // If already playing this sample, stop it
  if (currentPlayingId === sample.id && currentSource) {
    stopCurrent();
    return;
  }

  stopCurrent();

  // Show loading state
  const playBtn = document.querySelector(`.play-btn[data-id="${sample.id}"]`);
  if (playBtn) playBtn.innerHTML = '<span class="loading-spinner"></span> ...';

  try {
    const buffer = await getBuffer(sample);
    // Update waveform
    updateWaveformForSample(sample.id, buffer, true);

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(masterGain);
    currentSource = source;
    currentPlayingId = sample.id;

    const card = document.getElementById('card-' + sample.id);
    if (card) card.classList.add('playing');

    if (playBtn) playBtn.innerHTML = `
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="0" width="4" height="12"/><rect x="7" y="0" width="4" height="12"/></svg>
      Stop
    `;

    source.onended = () => {
      if (currentPlayingId === sample.id) {
        currentPlayingId = null;
        currentSource = null;
        if (card) card.classList.remove('playing');
        updateWaveformForSample(sample.id, buffer, false);
        if (playBtn) playBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="2,0 12,6 2,12"/></svg>
          Play
        `;
      }
    };

    source.start(0);
  } catch(e) {
    console.error('Generation error:', e);
    if (playBtn) playBtn.innerHTML = 'Error';
  }
}

function stopCurrent() {
  if (currentSource) {
    try { currentSource.stop(); } catch(e) {}
    const card = document.getElementById('card-' + currentPlayingId);
    if (card) card.classList.remove('playing');
    const playBtn = document.querySelector(`.play-btn[data-id="${currentPlayingId}"]`);
    if (playBtn) playBtn.innerHTML = `
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="2,0 12,6 2,12"/></svg>
      Play
    `;
    if (currentPlayingId && bufferCache[currentPlayingId]) {
      updateWaveformForSample(currentPlayingId, bufferCache[currentPlayingId], false);
    }
    currentSource = null;
    currentPlayingId = null;
  }
}

function updateWaveformForSample(id, buffer, playing) {
  const container = document.querySelector(`.waveform-container[data-id="${id}"]`);
  if (!container) return;
  let canvas = container.querySelector('canvas');
  if (!canvas) {
    container.innerHTML = '<canvas></canvas>';
    canvas = container.querySelector('canvas');
  }
  requestAnimationFrame(() => drawWaveform(canvas, buffer, playing));
}

// ─── Download ───────────────────────────────────────────────────────
async function downloadSample(sample) {
  const dlBtn = document.querySelector(`.dl-btn[data-id="${sample.id}"]`);
  if (dlBtn) dlBtn.innerHTML = '<span class="loading-spinner"></span>';

  try {
    const buffer = await getBuffer(sample);
    // Update waveform if not yet rendered
    updateWaveformForSample(sample.id, buffer, sample.id === currentPlayingId);

    const wav = encodeWAV(buffer);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sample.id + '.wav';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    console.error('Download error:', e);
  }

  if (dlBtn) dlBtn.innerHTML = `
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1v7M3 6l3 3 3-3M1 11h10"/></svg>
    WAV
  `;
}

// ─── Download All ───────────────────────────────────────────────────
document.getElementById('downloadAllBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadAllBtn');
  const samples = getFilteredSamples(activePack);
  btn.disabled = true;
  btn.textContent = `Generating 0/${samples.length}...`;

  for (let i = 0; i < samples.length; i++) {
    btn.textContent = `Generating ${i + 1}/${samples.length}...`;
    await downloadSample(samples[i]);
    // Small delay so downloads don't get throttled
    await new Promise(r => setTimeout(r, 200));
  }

  btn.disabled = false;
  btn.textContent = 'Download All';
});

// ─── Volume ─────────────────────────────────────────────────────────
document.getElementById('volumeSlider').addEventListener('input', (e) => {
  if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
});

// ─── Stop All ───────────────────────────────────────────────────────
document.getElementById('stopAllBtn').addEventListener('click', stopCurrent);

// ─── Search ─────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  // Auto-switch to a pack with results if current is empty
  const currentFiltered = getFilteredSamples(activePack);
  if (currentFiltered.length === 0 && searchTerm) {
    const packWithResults = allPacks.find(p => getFilteredSamples(p).length > 0);
    if (packWithResults) activePack = packWithResults;
  }
  renderSidebar();
  renderSamples();
});

// ─── Init ───────────────────────────────────────────────────────────
renderSidebar();
renderSamples();

// Handle window resize for waveform re-rendering
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.querySelectorAll('.waveform-container canvas').forEach(canvas => {
      const id = canvas.parentElement.dataset.id;
      if (bufferCache[id]) {
        drawWaveform(canvas, bufferCache[id], id === currentPlayingId);
      }
    });
  }, 150);
});
</script>
<script src="/related.js"></script>
</body>
